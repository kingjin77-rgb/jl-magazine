<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D2162;--navy-deep:#081541;--gold:#B08D4F;--gold-ink:#8F7033;
    --ink:#111418;--muted:#111418;--card:#F4F5F8;--line:#C7CBD3;--bg:#fff;--alert:#C0392B;--warn:#E67E22;}
  html,body{width:1332px;height:750px;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);position:relative;}
  .runner{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:15px;color:var(--muted);}
  .eyebrow{position:absolute;left:56px;top:70px;font-size:15px;letter-spacing:.2em;color:var(--gold-ink);
    font-weight:700;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--gold-ink);}
  .badge{position:absolute;right:56px;top:70px;font-size:14px;color:#8F7033;background:#FBF7EE;
    border:1px solid #E7D9BC;border-radius:0;padding:4px 10px;}
  .title{position:absolute;left:56px;top:96px;right:56px;font-size:26px;font-weight:800;
    color:var(--navy);letter-spacing:-.02em;line-height:1.4;}
  .note{font-size:14px;color:var(--muted);background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);
    border-radius:0;padding:12px 18px;line-height:1.6;}
  .note-gold{font-size:14px;color:var(--muted);background:#FBF7EE;border:1px solid #E7D9BC;
    border-radius:0;padding:12px 18px;line-height:1.7;}
  .footer{position:absolute;bottom:0;left:0;right:0;height:36px;display:flex;align-items:center;
    justify-content:space-between;padding:0 56px;border-top:1.4px solid var(--line);
    font-size:14px;color:var(--muted);}
  .footer .firm{color:var(--navy);font-weight:700;}

  .title{font-size:24px;}
  .cols{position:absolute;left:56px;top:168px;right:56px;bottom:56px;display:flex;gap:28px;}
  .colL{width:56%;border:1px solid var(--line);border-radius:0;overflow:hidden;}
  .colL img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .colR{width:44%;display:flex;flex-direction:column;}
  .std{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:0;padding:14px 16px;}
  .std .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--muted);}
  .std .row b{color:var(--ink);} .kscode{color:var(--navy);font-weight:800;}
  .case{margin-top:14px;font-size:15px;color:var(--muted);line-height:1.7;
    border-left:3px solid var(--gold);padding-left:14px;}
  .strength{margin-top:14px;font-size:14px;color:var(--gold-ink);background:#FBF7EE;border:1px solid #E7D9BC;
    border-radius:0;padding:10px 14px;line-height:1.6;}
</style>
</head>
<body>
  <div class="runner"><span>법무법인 제이엘 하자소송 수행 제안서</span><span>17 / 31</span></div>
  <div class="eyebrow">방화문 성능 미달 [고정]</div>
  <div class="title">외관은 멀쩡해도 내화·차연 성능시험에서 미달이 드러납니다</div>
  <div class="cols">
    <div class="colL"><img src="s17_firedoor_test.png"></div>
    <div class="colR">
      <div class="std">
        <div class="row"><span>내화 시험</span><b class="kscode">KS F 2268-1</b></div>
        <div class="row"><span>기준</span><b>비차열 1시간 이상 + 차열 30분 이상</b></div>
        <div class="row"><span>차연 성능 시험</span><b class="kscode">KS F 2846</b></div>
        <div class="row"><span>기준</span><b>차압 25Pa, 누설량 0.9㎥/min·㎡ 미만</b></div>
      </div>
      <div class="case">인정 사례: 제일풍경채센트럴 · 방화문 성능 미달 판결 확보 <span style="color:#8F7033">[금액 확인 대기]</span></div>
      <div class="strength">시료 선정부터 성적서 접수까지 감정 절차 전 과정에 입회합니다. 기술적으로 까다로워 다른 법인이 잘 다루지 못하는 항목입니다.</div>
    </div>
  </div>
  <div class="footer"><span class="firm">법무법인 제이엘</span><span>JL LAWFIRM</span></div>
</body>
</html>
