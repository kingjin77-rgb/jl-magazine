<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#223D5B;--fill:#385783;--navy-deep:#2A3B4F;--gold:#B08D4F;--gold-light:#EBD9B4;}
  html,body{width:1332px;height:750px;overflow:hidden;position:relative;
    font-family:"Pretendard","Malgun Gothic",sans-serif;
    background:linear-gradient(135deg,#223D5B 0%,#2A3B4F 100%);color:#fff;}
  .rule{position:absolute;left:0;top:0;width:100%;height:6px;background:var(--gold);}
  .pn{position:absolute;left:72px;top:150px;font-size:15px;letter-spacing:.34em;
    color:var(--gold-light);font-weight:700;}
  .kr{position:absolute;left:72px;top:186px;font-size:64px;font-weight:800;
    letter-spacing:-.025em;line-height:1.2;}
  .en{position:absolute;left:72px;top:290px;font-size:15px;letter-spacing:.24em;
    color:#FFFFFF;}
  .q{position:absolute;left:72px;top:348px;font-size:25px;font-weight:700;
    color:var(--gold-light);letter-spacing:-.01em;}
  .q::before{content:"";position:absolute;left:0;top:-20px;width:52px;height:3px;background:var(--gold);}
  .list{position:absolute;left:72px;top:436px;right:620px;display:flex;flex-direction:column;gap:0;}
  .li{font-size:16px;color:#FFFFFF;padding:11px 0;display:flex;gap:16px;
    border-bottom:1px solid rgba(255,255,255,.13);align-items:baseline;}
  .li b{font-size:12.5px;color:var(--gold-light);letter-spacing:.1em;font-weight:700;
    flex:0 0 26px;}
  .art{position:absolute;right:0;top:0;bottom:0;width:560px;overflow:hidden;
    display:flex;align-items:center;opacity:.95;}
  .art::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;
    background:rgba(255,255,255,.14);}
  .art .motif{width:126%;height:auto;display:block;margin-left:-6%;}
  .foot{position:absolute;left:72px;bottom:44px;font-size:13px;
    color:#FFFFFF;letter-spacing:.03em;}
  .page{position:absolute;right:72px;bottom:44px;font-size:13px;color:#FFFFFF;}
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="art"><svg class="motif" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="210" width="60" height="70" rx="4" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/><rect x="164" y="160" width="60" height="120" rx="4" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/><rect x="268" y="112" width="60" height="168" rx="4" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.16"/><rect x="372" y="70" width="60" height="210" rx="4" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.16"/><rect x="476" y="34" width="60" height="246" rx="4" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.16"/><rect x="60" y="280" width="524" height="2" fill="#EBD9B4" fill-opacity="0.5"/></svg></div>
  <div class="pn">PART 6</div>
  <div class="kr">비용과 조건</div>
  <div class="en">COST & TERMS</div>
  <div class="q">무엇을 부담하는가</div>
  <div class="list"><div class="li"><b>01</b>보수 조건</div><div class="li"><b>02</b>비용 부담 구조</div><div class="li"><b>03</b>유의사항</div></div>
  <div class="foot">법무법인 제이엘</div>
</body>
</html>
