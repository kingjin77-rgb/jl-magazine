<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 380" font-family="Pretendard, sans-serif"><defs><pattern id="h3" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#D8DCE4" stroke-width="2.4"/></pattern></defs><text x="0" y="22" font-size="16" fill="#0D2162" font-weight="800" text-anchor="start">미장 바름 두께 — 법원 실무서가 예시로 든 하자</text><text x="0" y="50" font-size="15" fill="#0D2162" font-weight="800" text-anchor="start">상세도 치수</text><rect x="0" y="62" width="300" height="140" fill="url(#h3)" stroke="#C7CBD3" stroke-width="1.4" /><text x="150" y="140" font-size="13" fill="#5A5F68" font-weight="400" text-anchor="middle">조적 벽체</text><rect x="300" y="62" width="60" height="140" fill="#0D2162" stroke="#0D2162" stroke-width="0" /><g stroke="#0D2162" stroke-width="1.3"><line x1="300" y1="220" x2="360" y2="220"/><line x1="300" y1="215" x2="300" y2="225"/><line x1="360" y1="215" x2="360" y2="225"/></g><text x="330.0" y="236" font-size="14" fill="#0D2162" font-weight="700" text-anchor="middle">18㎜</text><text x="376" y="138" font-size="13.5" fill="#0D2162" font-weight="700" text-anchor="start">미장</text><text x="640" y="50" font-size="15" fill="#C0392B" font-weight="800" text-anchor="start">현장 실측 평균</text><rect x="640" y="62" width="300" height="140" fill="url(#h3)" stroke="#C7CBD3" stroke-width="1.4" /><text x="790" y="140" font-size="13" fill="#5A5F68" font-weight="400" text-anchor="middle">조적 벽체</text><rect x="940" y="62" width="40" height="140" fill="#C0392B" stroke="#C0392B" stroke-width="0" /><g stroke="#C0392B" stroke-width="1.3"><line x1="940" y1="220" x2="980" y2="220"/><line x1="940" y1="215" x2="940" y2="225"/><line x1="980" y1="215" x2="980" y2="225"/></g><text x="960.0" y="236" font-size="14" fill="#C0392B" font-weight="700" text-anchor="middle">12㎜</text><text x="996" y="138" font-size="13.5" fill="#C0392B" font-weight="700" text-anchor="start">미장</text><path d="M556 130 h60" stroke="#5A5F68" stroke-width="2" fill="none"/><path d="M616 130 l-9 -5 v10 z" fill="#5A5F68"/><text x="586" y="117" font-size="13" fill="#C0392B" font-weight="800" text-anchor="middle">6㎜ 부족</text><rect x="0" y="250" width="1220" height="92" fill="#FBF7EE" stroke="#E7D9BC" stroke-width="1.4" /><text x="22" y="280" font-size="15" fill="#8F7033" font-weight="800" text-anchor="start">산정 방식이 원문에 확정되어 있습니다</text><text x="22" y="306" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">철거·재시공비가 아니라 하자 없이 시공했을 경우와 하자 있는 상태의 시공비용 차액입니다.</text><text x="22" y="328" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">사용검사 전 변경시공으로 판단되면 5년 구간에 남습니다.</text></svg>