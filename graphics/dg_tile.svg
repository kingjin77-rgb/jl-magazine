<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 380" font-family="Pretendard, sans-serif"><defs><pattern id="h2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#D8DCE4" stroke-width="2.4"/></pattern></defs><text x="0" y="22" font-size="16" fill="#0D2162" font-weight="800" text-anchor="start">타일 뒤채움 — 배면을 열어야 보입니다</text><text x="0" y="54" font-size="15" fill="#0D2162" font-weight="800" text-anchor="start">정상 시공</text><rect x="0" y="66" width="500" height="40" fill="url(#h2)" stroke="#C7CBD3" stroke-width="1.4" /><text x="250" y="92" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">바탕 모르타르</text><rect x="0" y="106" width="500" height="34" fill="#E9EDF8" stroke="#C7CBD3" stroke-width="1.4" /><text x="250" y="129" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">접착재(뒤채움)</text><rect x="3" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><rect x="128" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><rect x="253" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><rect x="378" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><text x="250" y="168" font-size="13" fill="#0D2162" font-weight="700" text-anchor="middle">타 일</text><text x="0" y="214" font-size="13.5" fill="#5A5F68" font-weight="400" text-anchor="start">접착재가 배면 전체에 채워진 상태</text><text x="640" y="54" font-size="15" fill="#C0392B" font-weight="800" text-anchor="start">뒤채움 부족</text><rect x="640" y="66" width="500" height="40" fill="url(#h2)" stroke="#C7CBD3" stroke-width="1.4" /><text x="890" y="92" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">바탕 모르타르</text><rect x="640" y="106" width="500" height="34" fill="#E9EDF8" stroke="#C7CBD3" stroke-width="1.4" /><rect x="700" y="106" width="90" height="34" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="850" y="106" width="70" height="34" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="990" y="106" width="100" height="34" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3"/><text x="890" y="129" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">접착재(뒤채움)</text><rect x="643" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><rect x="768" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><rect x="893" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><rect x="1018" y="140" width="119" height="44" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6" /><text x="890" y="168" font-size="13" fill="#0D2162" font-weight="700" text-anchor="middle">타 일</text><text x="640" y="214" font-size="13.5" fill="#5A5F68" font-weight="400" text-anchor="start">배면에 공극이 남아 들뜸·탈락으로 이어짐</text><rect x="0" y="250" width="1220" height="92" fill="#FBF7EE" stroke="#E7D9BC" stroke-width="1.4" /><text x="22" y="280" font-size="15" fill="#8F7033" font-weight="800" text-anchor="start">2026 개정판이 처음으로 기준을 제시했습니다</text><text x="22" y="306" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">인장 부착강도 0.39N/㎟ 미만이면 하자로 판정합니다. 시공 부위·바탕 접착 상태·들뜸 범위를</text><text x="22" y="328" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">함께 보아 철거 후 재시공과 접착재 주입 보수 중 어느 쪽인지가 정해집니다.</text></svg>