    <line x1="470" y1="12" x2="470" y2="48" stroke="#DDE2EC"/>
    <text x="498" y="26" font-size="14" fill="#5A6B85">타 단지 인정 사례 (세대당)</text>
    <text x="498" y="48" font-size="19" font-weight="700" fill="#C0392B">10.6만 ~ 50만원</text>
    <text x="742" y="48" font-size="14" fill="#5A6B85">단지 총액 7천만 ~ 4.5억원</text>
  </g>

  <text x="70" y="582" font-size="13" fill="#8289A3">모식도 · 인정 사례: 백석더샵(세대당 10.6만원, 총 약 7천만원) · 죽림부영1차(세대당 30~50만원, 총 약 4.5억원)</text>
