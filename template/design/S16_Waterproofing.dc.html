<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#223D5B;--fill:#385783;--navy-deep:#2A3B4F;--gold:#B08D4F;--gold-ink:#8F7033;
    --ink:#111418;--muted:#111418;--card:#E9EDF8;--line:#C6CFE0;--bg:#fff;--alert:#C0392B;--warn:#E67E22;}
  html,body{width:1332px;height:750px;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);position:relative;}
  .runner{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:15px;color:var(--muted);}
  .eyebrow{position:absolute;left:56px;top:70px;font-size:17px;letter-spacing:.2em;color:var(--gold-ink);
    font-weight:700;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--gold-ink);}
  .badge{position:absolute;right:56px;top:70px;font-size:14px;color:#8F7033;background:#FBF7EE;
    border:1px solid #E7D9BC;border-radius:0;padding:4px 10px;}
  .title{position:absolute;left:56px;top:96px;right:56px;font-size:35px;font-weight:800;
    color:var(--navy);letter-spacing:-.02em;line-height:1.4;}
  .note{font-size:14px;color:var(--muted);background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);
    border-radius:0;padding:12px 18px;line-height:1.6;}
  .note-gold{font-size:14px;color:var(--muted);background:#FBF7EE;border:1px solid #E7D9BC;
    border-radius:0;padding:12px 18px;line-height:1.7;}
  .footer{position:absolute;bottom:0;left:0;right:0;height:36px;display:flex;align-items:center;
    justify-content:space-between;padding:0 56px;border-top:1.4px solid var(--line);
    font-size:14px;color:var(--muted);}
  .footer .firm{color:var(--navy);font-weight:700;}

  .title{font-size:35px;line-height:1.34;}
  .cols{position:absolute;left:56px;top:186px;right:56px;bottom:56px;display:flex;gap:22px;}
  .photo{width:30%;border-radius:0;overflow:hidden;position:relative;}
  .photo img{width:100%;height:100%;object-fit:cover;}
  .photo .cap{position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(to top,rgba(8,21,65,.85),transparent);
    color:#fff;font-size:14px;padding:24px 12px 10px;line-height:1.5;}
  .diagram{width:32%;display:flex;flex-direction:column;}
  .diagram .box{flex:1;border:1px solid var(--line);border-radius:0;overflow:hidden;}
  .diagram img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .diagram .cap2{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.5;}
  .colR{width:38%;display:flex;flex-direction:column;}
  .meas{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:0;padding:14px 16px;}
  .meas .h{font-size:14px;font-weight:800;color:var(--navy);}
  .meas .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--muted);}
  .meas .row b{color:var(--ink);}
  .th,.tr{display:flex;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);}
  .th{color:var(--muted);font-weight:700;} .tr{color:var(--ink);}
  .t1{flex:1.4;} .t2{flex:.8;text-align:right;} .t3{flex:1;text-align:right;color:var(--navy);font-weight:700;}
  .cases{margin-top:12px;}

  /* ── 법무법인 제안서 헤더 밴드 ── */
  body::before{content:"";position:absolute;left:0;top:0;right:0;height:160px;
    background:linear-gradient(152deg,#385783 0%,#2A3B4F 100%);z-index:0;}
  body::after{content:"";position:absolute;left:0;top:160px;right:0;height:4px;
    background:var(--gold);z-index:1;}
  .runner{z-index:2;color:#FFFFFF!important;}
  .eyebrow{z-index:2;color:#EBD9B4!important;}
  .eyebrow::before{background:#EBD9B4!important;}
  .title{z-index:2;color:#FFFFFF!important;}
  .badge{z-index:2;background:rgba(255,255,255,.10)!important;
    border-color:rgba(203,178,126,.55)!important;color:#EBD9B4!important;}

  /* ── 바탕 ── 흰 여백이 구멍처럼 보이지 않도록 연한 지면을 깔고
     내용 블록을 흰색으로 올린다. 빈 곳도 지면으로 읽힌다. */
  html,body{background:#FFFFFF!important;}
  body>*:not(.runner):not(.eyebrow):not(.title):not(.badge):not(.footer){z-index:1;}
  .footer{background:#fff;border-top:2px solid var(--navy)!important;z-index:2;}
  /* 흰 블록 위로 올라오는 요소들 */
  .note,.card,.c,.g,.b,.n,.m,.st,.item,.qa,.q,.p,.w,.s,.z,.tbl,.table,
  .cards>div,.grid>div,.list>div,.cols>div,.need>div,.stages>div{background:#fff;}
  .note{background:#fff!important;}

  /* 네이비 패널 내부는 바탕 규칙에서 제외 (흰 칠이 글자를 덮지 않도록) */
  .warn *,.decide *,.result *,.rec *,.calc *,.contact *,.key *,.resp *,
  .sum *,.panel *,.band *,.record *,.total *{background:transparent!important;}

  /* 한글 자간 */ .eyebrow{letter-spacing:.02em!important;}

  /* ── 심층 검증 3단 밴드 (핵심 내용 · 수치 강조 · 기한 경고) ── */
  .verify{position:absolute;left:56px;right:56px;bottom:96px;height:152px;
    display:grid;grid-template-columns:1fr 1fr 1fr;
    border:1.4px solid var(--line);border-top:3px solid var(--navy);background:#fff;}
  .verify>div{padding:13px 18px 12px;border-left:1px solid var(--line);}
  .verify>div:first-child{border-left:0;}
  .verify .vk{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:7px;
    display:flex;align-items:center;gap:7px;letter-spacing:-.01em;}
  .verify .vk::before{content:"";width:4px;height:15px;background:var(--gold);}
  .verify .vv{font-size:15.5px;line-height:1.6;color:var(--ink);}
  .verify .warnk{color:#C0392B;}
  .verify .warnk::before{background:#C0392B!important;}
  .verify *{background:transparent;}

  /* ── 판정 기준 · 조사 방법 (인정 금액 표를 대체) ── */
  .method{margin-top:10px;}
  .mh{font-size:13px;font-weight:800;color:var(--gold-ink);letter-spacing:.02em;
    padding-bottom:6px;border-bottom:1.6px solid var(--navy);margin-bottom:7px;}
  .method .mh+.mh,.method .mr+.mh{margin-top:15px;}
  .mr{display:flex;gap:10px;font-size:13px;line-height:1.45;padding:3.4px 0;
    border-bottom:1px solid var(--line);}
  .mr:last-child{border-bottom:0;}
  .mr span{flex:0 0 74px;color:var(--navy);font-weight:700;}
  .mr b{flex:1;font-weight:500;color:var(--ink);}

  /* ── 한글 줄바꿈 ── 기본값은 한글을 어절 중간에서 끊는다.
     keep-all로 띄어쓰기 단위로만 넘기고, 끊을 곳이 없는 긴 문자열만 예외로 둔다. */
  *{word-break:keep-all;overflow-wrap:break-word;}
</style>
</head>
<body>
  <div class="runner"><span>법무법인 제이엘 하자소송 수행 제안서</span></div>
  <div class="eyebrow">욕실·발코니 방수 부족시공 [고정]</div>
  <div class="title">방수 두께는 원·피고 감정인 공동조사 실측으로 증명합니다</div>
  <div class="cols">
    <div class="photo"><img src="cover-photo.jpg">
      <div class="cap">현장 실측 · 파취조사 후 바닥 두께 계측</div></div>
    <div class="diagram"><div class="box"><img src="s16_urethane_thickness.png"></div>
      <div class="cap2">측정 방법 모식도 (보조 사례 · 옥탑·옥상 노출우레탄, 기준 3mm 대비 실측 1.82mm) · 우측 감정 실측값(발코니·욕실)과는 별개 사례입니다.</div></div>
    <div class="colR">
      <div class="method">
        <div class="mh">조사 방법</div>
        <div class="mr"><span>1</span><b>원·피고 감정인 공동조사에서 바닥 파취</b></div>
        <div class="mr"><span>2</span><b>방수층 두께를 계측기로 실측·촬영</b></div>
        <div class="mr"><span>3</span><b>설계도서 기준 두께와 대조해 부족분 산정</b></div>
      </div>
    </div>
  </div>
  <div class="footer"><span class="firm">법무법인 제이엘</span><span>JL LAWFIRM</span></div>
</body>
</html>
