<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D2162;--navy-deep:#081541;--gold:#B08D4F;--gold-ink:#8F7033;
    --ink:#111418;--line:#C7CBD3;}
  html,body{width:1332px;height:750px;overflow:hidden;background:#fff;
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);position:relative;}

  /* 상단 실사 밴드 — 단지 전경 사진이 확보되면 이 이미지를 교체한다 */
  .band{position:absolute;top:0;left:0;right:0;height:352px;overflow:hidden;background:var(--navy);}
  .band .skyline{width:100%;height:100%;display:block;}
  .rule{position:absolute;top:352px;left:0;right:0;height:5px;background:var(--gold);}

  /* 로고 — 밴드 아래 우측 */
  .logo{position:absolute;top:392px;right:56px;height:44px;width:auto;display:block;}

  .eyebrow{position:absolute;left:56px;top:404px;font-size:14px;letter-spacing:.26em;
    color:var(--gold-ink);font-weight:700;}

  .title{position:absolute;left:56px;top:436px;right:340px;
    font-size:40px;font-weight:800;line-height:1.34;letter-spacing:-.02em;color:var(--navy);}
  .title .l2{color:var(--gold-ink);}

  .desc{position:absolute;left:56px;top:576px;right:340px;
    font-size:15px;color:var(--ink);letter-spacing:-.01em;}
  .desc span{color:var(--line);margin:0 10px;}

  .stats{position:absolute;left:56px;top:626px;right:56px;display:flex;
    border-top:1.6px solid var(--line);padding-top:18px;}
  .stat{padding-right:56px;}
  .stat .n{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
  .stat .l{margin-top:5px;font-size:13.5px;color:var(--ink);}
  .recipient{margin-left:auto;text-align:right;align-self:flex-end;}
  .recipient .k{font-size:13.5px;color:var(--gold-ink);font-weight:700;}
  .recipient .v{margin-top:5px;font-size:17px;font-weight:800;color:var(--navy);}
</style>
</head>
