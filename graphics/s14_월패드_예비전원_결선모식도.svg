    <line x1="215" y1="286" x2="215" y2="312" stroke="#385783" stroke-width="2"/>
    <rect x="90" y="312" width="250" height="44" rx="6" fill="#E9EDF8"/>
    <text x="128" y="340" font-size="16" font-weight="700" fill="#223D5B">거실 월패드 정상 동작</text>
  </g>

  <line x1="586" y1="126" x2="586" y2="480" stroke="#DDE2EC" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 우: 현장 -->
  <g transform="translate(630,116)">
    <rect x="0" y="0" width="430" height="34" rx="6" fill="#F9E9E7"/>
    <text x="20" y="23" font-size="16" font-weight="700" fill="#C0392B">현장 확인</text>
    <text x="272" y="23" font-size="13" fill="#B07068">단자함 개방 조사</text>

    <text x="0" y="62" font-size="13" fill="#5A6B85">세대 통신단자함</text>
    <rect x="0" y="72" width="430" height="196" rx="8" fill="#FBFCFE" stroke="#C4CCDD"/>

    <rect x="24" y="96" width="382" height="46" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="44" y="125" font-size="16" font-weight="700" fill="#C0392B">홈게이트웨이</text>
    <text x="308" y="125" font-size="14" font-weight="700" fill="#C0392B">미시공</text>

    <rect x="24" y="152" width="382" height="46" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="44" y="181" font-size="16" font-weight="700" fill="#C0392B">예비전원장치 (APU)</text>
    <text x="308" y="181" font-size="14" font-weight="700" fill="#C0392B">미시공</text>

    <rect x="24" y="208" width="382" height="42" rx="6" fill="#E9EDF8" stroke="#DDE2EC"/>
    <text x="44" y="235" font-size="15" fill="#223D5B">통신 단자대</text>
    <text x="330" y="235" font-size="13" fill="#5A6B85">설치</text>

    <line x1="215" y1="286" x2="215" y2="312" stroke="#C0392B" stroke-width="2"/>
    <rect x="60" y="312" width="310" height="44" rx="6" fill="#F9E9E7"/>
    <text x="86" y="340" font-size="15" font-weight="700" fill="#C0392B">정전 시 기능 정지 · 보안 취약</text>
  </g>

  <!-- 결론 -->
  <g transform="translate(70,500)">
    <rect x="0" y="0" width="990" height="60" rx="8" fill="#FFFFFF" stroke="#DDE2EC"/>
    <rect x="0" y="0" width="5" height="60" rx="2" fill="#C0392B"/>
    <text x="28" y="26" font-size="14" fill="#5A6B85">판정 방법</text>
