<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'210 옴니고딕 030','OmniGothic030','Pretendard',sans-serif">
  <rect width="1200" height="600" fill="#FFFFFF"/>

  <rect x="40" y="34" width="42" height="5" fill="#385783"/>
  <text x="96" y="46" font-size="27" font-weight="700" fill="#385783">세대 월패드 예비전원장치·홈게이트웨이 미시공</text>
  <text x="96" y="72" font-size="13" fill="#8289A3" letter-spacing="2.6">WALL PAD BACKUP POWER UNIT · WIRING</text>

  <!-- 좌: 설계도면 기준 -->
  <g transform="translate(70,116)">
    <rect x="0" y="0" width="430" height="34" rx="6" fill="#E9EDF8"/>
