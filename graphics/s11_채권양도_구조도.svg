  <text x="60" y="574" font-size="13" fill="#5A5F68">93.28% = 법무법인 제이엘 수행 사건 중 판결문에서 양도비율이 확인된 15건의 단순평균(범위 75.01~100.00%) · 개별 사건의 양도비율을 보장하지 않음</text>
