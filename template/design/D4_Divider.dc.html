<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D2162;--navy-deep:#081541;--gold:#B08D4F;--gold-light:#CBB27E;}
  html,body{width:1332px;height:750px;overflow:hidden;position:relative;
    font-family:"Pretendard","Malgun Gothic",sans-serif;
    background:linear-gradient(135deg,#0D2162 0%,#081541 100%);color:#fff;}
  .rule{position:absolute;left:0;top:0;width:100%;height:6px;background:var(--gold);}
  .pn{position:absolute;left:72px;top:150px;font-size:15px;letter-spacing:.34em;
    color:var(--gold-light);font-weight:700;}
  .kr{position:absolute;left:72px;top:186px;font-size:64px;font-weight:800;
    letter-spacing:-.025em;line-height:1.2;}
  .en{position:absolute;left:72px;top:290px;font-size:15px;letter-spacing:.24em;
    color:rgba(255,255,255,.60);}
  .q{position:absolute;left:72px;top:348px;font-size:25px;font-weight:700;
    color:var(--gold-light);letter-spacing:-.01em;}
  .q::before{content:"";position:absolute;left:0;top:-20px;width:52px;height:3px;background:var(--gold);}
  .list{position:absolute;left:72px;top:436px;right:620px;display:flex;flex-direction:column;gap:0;}
  .li{font-size:16px;color:rgba(255,255,255,.92);padding:11px 0;display:flex;gap:16px;
    border-bottom:1px solid rgba(255,255,255,.13);align-items:baseline;}
  .li b{font-size:12.5px;color:var(--gold-light);letter-spacing:.1em;font-weight:700;
    flex:0 0 26px;}
  .art{position:absolute;right:0;top:0;bottom:0;width:560px;overflow:hidden;
    display:flex;align-items:center;opacity:.95;}
  .art::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;
    background:rgba(255,255,255,.14);}
  .art .motif{width:126%;height:auto;display:block;margin-left:-6%;}
  .foot{position:absolute;left:72px;bottom:44px;font-size:13px;
    color:rgba(255,255,255,.55);letter-spacing:.03em;}
  .page{position:absolute;right:72px;bottom:44px;font-size:13px;color:rgba(255,255,255,.55);}
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="art"><svg class="motif" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="60" width="640" height="34" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.18"/><rect x="40" y="94" width="640" height="26" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.18"/><rect x="40" y="120" width="640" height="50" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/><path d="M250 60 L268 94 L242 94 L262 120 L236 120 L256 170" stroke="#CBB27E" stroke-opacity="0.75" stroke-width="3" fill="none"/><path d="M110 60 L120 94 L104 94 L118 120" stroke="#CBB27E" stroke-opacity="0.45" stroke-width="2.4" fill="none"/><path d="M430 60 L440 94 L424 94 L438 120" stroke="#CBB27E" stroke-opacity="0.45" stroke-width="2.4" fill="none"/><path d="M560 60 L570 94 L554 94 L568 120" stroke="#CBB27E" stroke-opacity="0.45" stroke-width="2.4" fill="none"/><path d="M40 196 h640" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1.4" stroke-dasharray="7 7"/></svg></div>
  <div class="pn">PART 4</div>
  <div class="kr">하자 발굴</div>
  <div class="en">DEFECT DISCOVERY</div>
  <div class="q">무엇을 찾아내는가</div>
  <div class="list"><div class="li"><b>01</b>하자조사 절차 90일</div><div class="li"><b>02</b>주요 하자 유형</div><div class="li"><b>03</b>유형별 판정 기준과 인정 사례</div></div>
  <div class="foot">법무법인 제이엘</div>
  <div class="page"><span>00 / 40</span></div>
</body>
</html>
