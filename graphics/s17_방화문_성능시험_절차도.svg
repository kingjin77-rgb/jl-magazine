<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'210 옴니고딕 030','OmniGothic030','Pretendard',sans-serif">
  <defs>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8FA3C4"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#FFFFFF"/>

  <rect x="40" y="34" width="42" height="5" fill="#B08D4F"/>
  <text x="96" y="46" font-size="27" font-weight="700" fill="#0D2162">방화문 성능 미달 · 판단 기준과 감정 절차</text>
  <text x="96" y="72" font-size="13" fill="#8F7033" letter-spacing="2.6">FIRE DOOR PERFORMANCE TEST · PROCEDURE</text>

  <!-- 판단 기준 2종 -->
  <text x="70" y="118" font-size="15" font-weight="700" fill="#081541">판단 기준</text>
  <text x="148" y="118" font-size="12" fill="#5A5F68" letter-spacing="1.6">CRITERIA</text>
  <line x1="70" y1="128" x2="1130" y2="128" stroke="#0D2162" stroke-width="2"/>

  <g transform="translate(70,144)">
    <rect x="0" y="0" width="520" height="104" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="0" y="0" width="4" height="104" rx="2" fill="#0D2162"/>
    <text x="24" y="30" font-size="13" fill="#5A5F68" letter-spacing="1.2">KS F 2268-1</text>
    <text x="24" y="56" font-size="18" font-weight="700" fill="#081541">내화 시험</text>
    <text x="24" y="82" font-size="15" fill="#42506A">비차열 1시간 이상 · 차열 30분 이상 만족</text>
  </g>

  <g transform="translate(610,144)">
    <rect x="0" y="0" width="520" height="104" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="0" y="0" width="4" height="104" rx="2" fill="#0D2162"/>
    <text x="24" y="30" font-size="13" fill="#5A5F68" letter-spacing="1.2">KS F 2846</text>
    <text x="24" y="56" font-size="18" font-weight="700" fill="#081541">차연 성능 시험</text>
    <text x="24" y="82" font-size="15" fill="#42506A">차압 25Pa일 때 공기누설량 0.9㎥/min·㎡ 미만</text>
  </g>

  <!-- 감정 절차 5단계 -->
  <text x="70" y="298" font-size="15" font-weight="700" fill="#081541">감정 절차</text>
  <text x="152" y="298" font-size="12" fill="#5A5F68" letter-spacing="1.6">5 STEPS</text>
  <line x1="70" y1="308" x2="1130" y2="308" stroke="#0D2162" stroke-width="2"/>

  <g transform="translate(70,326)">
    <!-- 1 -->
    <rect x="0" y="0" width="188" height="130" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="16" y="16" width="30" height="30" rx="6" fill="#EFF2FB"/>
    <text x="26" y="37" font-size="16" font-weight="700" fill="#0D2162">1</text>
    <text x="16" y="70" font-size="16" font-weight="700" fill="#081541">시료 선정</text>
    <text x="16" y="94" font-size="12" fill="#42506A">표본 위치·개소 확정</text>
    <text x="16" y="112" font-size="12" fill="#42506A">원·피고 감정인 날인</text>
    <line x1="196" y1="65" x2="216" y2="65" stroke="#8FA3C4" stroke-width="1.8" marker-end="url(#fa)"/>

    <!-- 2 -->
    <rect x="222" y="0" width="188" height="130" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="238" y="16" width="30" height="30" rx="6" fill="#EFF2FB"/>
    <text x="248" y="37" font-size="16" font-weight="700" fill="#0D2162">2</text>
    <text x="238" y="70" font-size="16" font-weight="700" fill="#081541">방화문 철거</text>
    <text x="238" y="94" font-size="12" fill="#42506A">시험용 시료 반출</text>
    <text x="238" y="112" font-size="12" fill="#42506A">신규 방화문 설치</text>
    <line x1="418" y1="65" x2="438" y2="65" stroke="#8FA3C4" stroke-width="1.8" marker-end="url(#fa)"/>

    <!-- 3 -->
    <rect x="444" y="0" width="188" height="130" rx="8" fill="#FFFFFF" stroke="#0D2162" stroke-width="1.6"/>
    <rect x="460" y="16" width="30" height="30" rx="6" fill="#0D2162"/>
    <text x="470" y="37" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="460" y="70" font-size="16" font-weight="700" fill="#081541">성능 시험</text>
    <text x="460" y="94" font-size="12" fill="#42506A">시험기관 입고·입회</text>
    <text x="460" y="112" font-size="12" fill="#0D2162">KS F 2268-1 · 2846</text>
    <line x1="640" y1="65" x2="660" y2="65" stroke="#8FA3C4" stroke-width="1.8" marker-end="url(#fa)"/>

    <!-- 4 -->
    <rect x="666" y="0" width="188" height="130" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="682" y="16" width="30" height="30" rx="6" fill="#EFF2FB"/>
    <text x="692" y="37" font-size="16" font-weight="700" fill="#0D2162">4</text>
    <text x="682" y="70" font-size="16" font-weight="700" fill="#081541">시험 결과</text>
    <text x="682" y="94" font-size="12" fill="#42506A">시험성적서 접수</text>
    <text x="682" y="112" font-size="12" fill="#42506A">기준 충족 여부 확인</text>
    <line x1="862" y1="65" x2="882" y2="65" stroke="#8FA3C4" stroke-width="1.8" marker-end="url(#fa)"/>

    <!-- 5 -->
    <rect x="888" y="0" width="188" height="130" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="904" y="16" width="30" height="30" rx="6" fill="#EFF2FB"/>
    <text x="914" y="37" font-size="16" font-weight="700" fill="#0D2162">5</text>
    <text x="904" y="70" font-size="16" font-weight="700" fill="#081541">감정서 작성</text>
    <text x="904" y="94" font-size="12" fill="#42506A">감정사항 기재</text>
    <text x="904" y="112" font-size="12" fill="#42506A">감정금액 산출</text>
  </g>

  <!-- 결론 -->
  <g transform="translate(70,482)">
    <rect x="0" y="0" width="1060" height="62" rx="8" fill="#FFFFFF" stroke="#C7CBD3"/>
    <rect x="0" y="0" width="5" height="62" rx="2" fill="#C0392B"/>
    <text x="28" y="26" font-size="14" fill="#42506A">이 항목의 특징</text>
    <text x="28" y="49" font-size="15" fill="#081541">외관상 드러나지 않아 시험을 거쳐야만 확인된다 · 기술적 난도가 높아 다루는 법인이 적다</text>
    <line x1="740" y1="12" x2="740" y2="50" stroke="#C7CBD3"/>
    <text x="768" y="26" font-size="14" fill="#42506A">수행 사례</text>
    <text x="768" y="49" font-size="15" font-weight="700" fill="#0D2162">제일풍경채센트럴 · 방화문 항목 수행</text>
  </g>

  <text x="70" y="572" font-size="13" fill="#5A5F68">절차도 · 시험 규격과 기준값은 KS 규격 기재 내용. 감정 절차는 사건별로 달라질 수 있음</text>
</svg>
