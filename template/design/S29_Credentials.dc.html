<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D2162;--navy-deep:#081541;--gold:#B08D4F;--gold-ink:#8F7033;
    --ink:#111418;--muted:#111418;--card:#F4F5F8;--line:#C7CBD3;--bg:#fff;--alert:#C0392B;--warn:#E67E22;}
  html,body{width:1332px;height:750px;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);position:relative;}
  .runner{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:13.5px;color:var(--muted);}
  .eyebrow{position:absolute;left:56px;top:70px;font-size:13.5px;letter-spacing:.2em;color:var(--gold-ink);
    font-weight:700;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--gold-ink);}
  .badge{position:absolute;right:56px;top:70px;font-size:12.5px;color:#8F7033;background:#FBF7EE;
    border:1px solid #E7D9BC;border-radius:3px;padding:4px 10px;}
  .title{position:absolute;left:56px;top:96px;right:56px;font-size:26px;font-weight:800;
    color:var(--navy);letter-spacing:-.02em;line-height:1.4;}
  .note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:12px 18px;line-height:1.6;}
  .note-gold{font-size:12.5px;color:var(--muted);background:#FBF7EE;border:1px solid #E7D9BC;
    border-radius:4px;padding:12px 18px;line-height:1.7;}
  .footer{position:absolute;bottom:0;left:0;right:0;height:36px;display:flex;align-items:center;
    justify-content:space-between;padding:0 56px;border-top:1.4px solid var(--line);
    font-size:12.5px;color:var(--muted);}
  .footer .firm{color:var(--navy);font-weight:700;}

  .cards{position:absolute;left:56px;top:200px;right:56px;bottom:56px;display:flex;gap:24px;}
  .c{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:26px 22px;}
  .c .t{font-size:15px;font-weight:800;color:var(--navy);}
  .c .d{margin-top:12px;font-size:13.5px;color:var(--muted);line-height:1.8;}
</style>
</head>
<body>
  <div class="runner"><span>법무법인 제이엘 하자소송 수행 제안서</span><span>29 / 31</span></div>
  <div class="eyebrow">자격 · 보험 [고정]</div>
  <div class="title">건설 전문성과 배상 안전장치를 함께 갖췄습니다</div>
  <div class="cards">
    <div class="c"><div class="t">건설 전문분야 등록</div>
      <div class="d">건설 분야 전문 소송 수행 등록을 마친 법인입니다.</div></div>
    <div class="c"><div class="t">배상책임보험</div>
      <div class="d">수임 사건 수행 과정의 배상책임에 대비한 보험에 가입되어 있습니다.</div></div>
    <div class="c"><div class="t">건축시공기술사 사무장</div>
      <div class="d">건축시공기술사 자격을 갖춘 사무장이 하자 조사·감정 대응을 기술적으로 뒷받침합니다.</div></div>
  </div>
  <div class="footer"><span class="firm">법무법인 제이엘</span><span>JL LAWFIRM</span></div>
</body>
</html>
