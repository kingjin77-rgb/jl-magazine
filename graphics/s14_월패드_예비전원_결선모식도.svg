    <rect x="0" y="72" width="430" height="196" rx="8" fill="#FBFCFE" stroke="#C4CCDD"/>

    <rect x="24" y="96" width="382" height="46" rx="6" fill="#385783"/>
    <text x="44" y="125" font-size="16" font-weight="700" fill="#FFFFFF">홈게이트웨이</text>
    <text x="330" y="125" font-size="13" fill="#DDE6F5">설치</text>

    <rect x="24" y="152" width="382" height="46" rx="6" fill="#385783"/>
