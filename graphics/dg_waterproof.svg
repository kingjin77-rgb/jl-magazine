<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 380" font-family="Pretendard, sans-serif"><defs><pattern id="h1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#D8DCE4" stroke-width="2.4"/></pattern></defs><text x="0" y="22" font-size="16" fill="#0D2162" font-weight="800" text-anchor="start">설계 기준과 실측의 차이 — 방수층 단면</text><text x="0" y="58" font-size="15" fill="#0D2162" font-weight="800" text-anchor="start">설계도서 기준</text><rect x="0" y="70" width="500" height="90" fill="url(#h1)" stroke="#C7CBD3" stroke-width="1.4" /><text x="250" y="125" font-size="13" fill="#5A5F68" font-weight="400" text-anchor="middle">콘크리트 슬래브</text><rect x="0" y="44" width="500" height="26" fill="#0D2162" stroke="#0D2162" stroke-width="0" /><text x="250" y="34" font-size="13" fill="#0D2162" font-weight="700" text-anchor="middle">방수층</text><rect x="0" y="18" width="500" height="26" fill="#F4F5F8" stroke="#C7CBD3" stroke-width="1.4" /><text x="250" y="34" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">바닥 마감</text><g stroke="#0D2162" stroke-width="1.3"><line x1="520" y1="44" x2="520" y2="70"/><line x1="514" y1="44" x2="526" y2="44"/><line x1="514" y1="70" x2="526" y2="70"/></g><text x="534" y="62.0" font-size="15" fill="#0D2162" font-weight="800" text-anchor="start">T</text><text x="0" y="188" font-size="13.5" fill="#5A5F68" font-weight="400" text-anchor="start">상세도에 적힌 두께</text><text x="640" y="58" font-size="15" fill="#C0392B" font-weight="800" text-anchor="start">파취 후 실측</text><rect x="640" y="70" width="500" height="90" fill="url(#h1)" stroke="#C7CBD3" stroke-width="1.4" /><text x="890" y="125" font-size="13" fill="#5A5F68" font-weight="400" text-anchor="middle">콘크리트 슬래브</text><rect x="640" y="59" width="500" height="11" fill="#C0392B" stroke="#C0392B" stroke-width="0" /><text x="890" y="49" font-size="13" fill="#C0392B" font-weight="700" text-anchor="middle">방수층</text><rect x="640" y="33" width="500" height="26" fill="#F4F5F8" stroke="#C7CBD3" stroke-width="1.4" /><text x="890" y="49" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">바닥 마감</text><g stroke="#C0392B" stroke-width="1.3"><line x1="1160" y1="59" x2="1160" y2="70"/><line x1="1154" y1="59" x2="1166" y2="59"/><line x1="1154" y1="70" x2="1166" y2="70"/></g><text x="1174" y="69.5" font-size="15" fill="#C0392B" font-weight="800" text-anchor="start">T</text><text x="640" y="188" font-size="13.5" fill="#5A5F68" font-weight="400" text-anchor="start">기준에 못 미치는 두께</text><path d="M556 105 h60" stroke="#5A5F68" stroke-width="2" fill="none"/><path d="M616 105 l-9 -5 v10 z" fill="#5A5F68"/><text x="586" y="92" font-size="13" fill="#5A5F68" font-weight="700" text-anchor="middle">대조</text><rect x="0" y="250" width="1220" height="92" fill="#FBF7EE" stroke="#E7D9BC" stroke-width="1.4" /><text x="22" y="280" font-size="15" fill="#8F7033" font-weight="800" text-anchor="start">차이가 곧 보수 범위입니다</text><text x="22" y="306" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">사진으로는 이 두께 차이가 보이지 않습니다. 파취 후 계측기 눈금이 함께 찍힌 사진과</text><text x="22" y="328" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">이 단면 모식도를 함께 제시해야 부족분이 드러납니다.</text></svg>