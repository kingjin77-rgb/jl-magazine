<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#223D5B;--fill:#385783;--navy-deep:#2A3B4F;--gold:#B08D4F;
    --gold-light:#EBD9B4;--line:#C6CFE0;}
  html,body{width:1332px;height:750px;overflow:hidden;position:relative;
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:#FFFFFF;
    background:#2A3B4F;}

  /* ── 실사 사진 전면 배경 ──
     파일이 없으면 아래 그러데이션만 보이므로 레이아웃이 깨지지 않는다.
     사진은 template/design/photos/p-part1.jpg 로 두면 그대로 들어간다. */
  .bg{position:absolute;inset:0;
    background:linear-gradient(150deg,#385783 0%,#2A3B4F 100%),
               url(p-part1.jpg) center/cover no-repeat;
    background-blend-mode:normal;}
  .bg img{width:100%;height:100%;object-fit:cover;display:block;}
  /* 글자가 얹히는 왼쪽을 어둡게 눌러 사진이 어떤 밝기든 읽히게 한다 */
  .scrim{position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(23,38,58,.94) 0%,rgba(23,38,58,.88) 38%,
               rgba(23,38,58,.42) 68%,rgba(23,38,58,.30) 100%);}
  .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold);}
  .hint{position:absolute;right:44px;top:34px;font-size:12px;letter-spacing:.14em;
    color:rgba(255,255,255,.55);}

  .pn{position:absolute;left:76px;top:152px;font-size:15px;letter-spacing:.34em;
    color:var(--gold-light);font-weight:700;}
  .kr{position:absolute;left:76px;top:188px;font-size:66px;font-weight:800;
    letter-spacing:-.03em;line-height:1.16;text-shadow:0 2px 18px rgba(0,0,0,.35);}
  .en{position:absolute;left:76px;top:280px;font-size:15px;letter-spacing:.24em;
    color:#FFFFFF;}
  .q{position:absolute;left:76px;top:338px;font-size:26px;font-weight:700;
    color:var(--gold-light);letter-spacing:-.01em;}
  .q::before{content:"";position:absolute;left:0;top:-22px;width:56px;height:4px;background:var(--gold);}
  .list{position:absolute;left:76px;top:426px;width:470px;}
  .li{font-size:16.5px;color:#FFFFFF;padding:11px 0;display:flex;gap:16px;
    border-bottom:1px solid rgba(255,255,255,.24);align-items:baseline;}
  .li b{font-size:12.5px;color:var(--gold-light);letter-spacing:.1em;font-weight:700;flex:0 0 26px;}
  .foot{position:absolute;left:76px;bottom:44px;font-size:13.5px;color:#FFFFFF;letter-spacing:.03em;}
  .firm{position:absolute;right:44px;bottom:44px;font-size:13.5px;color:#FFFFFF;letter-spacing:.06em;}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="edge"></div>
  <div class="hint">사진 자리 · 법인 사무실 또는 변호사 집무 장면</div>
  <div class="pn">PART 1</div>
  <div class="kr">법무법인 제이엘</div>
  <div class="en">THE FIRM</div>
  <div class="q">누가 이 사건을 수행하는가</div>
  <div class="list"><div class="li"><b>01</b>법인 개요</div><div class="li"><b>02</b>대표변호사 인사</div><div class="li"><b>03</b>담당 변호사</div><div class="li"><b>04</b>하자소송 수행 실적</div><div class="li"><b>05</b>자격 · 보험 · 조직</div></div>
  <div class="foot">법무법인 제이엘</div>
  <div class="firm">JL LAWFIRM</div>
</body>
</html>
