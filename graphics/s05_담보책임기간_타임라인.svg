<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'210 옴니고딕 030','OmniGothic030','Pretendard',sans-serif">
  <defs>
    <marker id="flagTop" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3.2" fill="#2A3B4F"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#FFFFFF"/>

  <!-- 제목 -->
  <rect x="40" y="34" width="42" height="5" fill="#385783"/>
  <text x="96" y="46" font-size="26" font-weight="700" fill="#385783">담보책임기간 4개 구간 중 3개가 이미 도과했습니다</text>
  <text x="96" y="70" font-size="12.5" fill="#8289A3" letter-spacing="2.4">DEFECT LIABILITY PERIOD &#183; TIMELINE</text>

  <!-- 카드 -->
  <g transform="translate(40,92)">
    <rect x="0" y="0" width="1120" height="470" rx="12" fill="#FFFFFF" stroke="#DDE2EC" stroke-width="1.5"/>

    <!-- 상단 정보줄 -->
    <text x="30" y="26" font-size="13" fill="#8289A3">이스트힐아파트(예시) &#183; 사용검사일 2016-11-01 &#183; 기준일 2026-08-18</text>

    <!-- 범례 -->
    <rect x="870" y="16" width="14" height="14" rx="2" fill="#385783"/>
    <text x="890" y="27" font-size="13" fill="#223D5B">여유</text>
    <rect x="958" y="16" width="14" height="14" rx="2" fill="#E67E22"/>
    <text x="978" y="27" font-size="13" fill="#223D5B">임박</text>
    <rect x="1046" y="16" width="14" height="14" rx="2" fill="#C0392B"/>
    <text x="1066" y="27" font-size="13" fill="#223D5B">도과</text>

    <line x1="30" y1="36" x2="1090" y2="36" stroke="#DDE2EC" stroke-width="1"/>

    <!-- 사용검사일 기준선 -->
    <line x1="300" y1="58" x2="300" y2="410" stroke="#C7CEE1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="300" y="52" font-size="11" fill="#8289A3" text-anchor="middle">사용검사일 2016-11-01</text>

    <!-- 오늘 기준선 -->
    <line x1="1049.2" y1="58" x2="1049.2" y2="434" stroke="#2A3B4F" stroke-width="1.6" stroke-dasharray="5 4"/>
    <circle cx="1049.2" cy="58" r="3" fill="#2A3B4F"/>
    <text x="1049.2" y="448" font-size="12.5" font-weight="700" fill="#2A3B4F" text-anchor="middle">오늘 2026-08-18</text>

    <!-- ===== 행 1: 주요구조부 (10년, 임박) ===== -->
    <g>
      <rect x="30" y="118" width="44" height="28" rx="6" fill="#E9EDF8"/>
      <text x="52" y="137" font-size="14" font-weight="700" fill="#385783" text-anchor="middle">10년</text>
      <text x="86" y="130" font-size="14" font-weight="700" fill="#223D5B">주요구조부 &#183; 지반공사</text>
      <text x="86" y="146" font-size="10.5" fill="#8289A3">공용부분 &#183; 사용검사일 기산</text>

      <rect x="300" y="122" width="764.9" height="20" rx="4" fill="#E67E22"/>
      <line x1="1064.9" y1="106" x2="1064.9" y2="153" stroke="#E67E22" stroke-width="2"/>
      <text x="1028" y="104" font-size="12.5" font-weight="700" fill="#E67E22" text-anchor="end">만료 2026-11-01</text>
      <text x="1028" y="117" font-size="10" fill="#8289A3" text-anchor="end">2016-11-01 + 10년 = 2026-11-01</text>
    </g>

    <!-- ===== 행 2: 구조상&#183;안전상 (5년, 도과) ===== -->
    <g>
      <rect x="30" y="202" width="44" height="28" rx="6" fill="#E9EDF8"/>
      <text x="52" y="221" font-size="14" font-weight="700" fill="#385783" text-anchor="middle">5년</text>
      <text x="86" y="214" font-size="14" font-weight="700" fill="#223D5B">구조상 &#183; 안전상</text>
      <text x="86" y="230" font-size="10.5" fill="#8289A3">철근콘크리트&#183;조적&#183;지붕&#183;방수 등</text>

      <rect x="300" y="206" width="382.4" height="20" rx="4" fill="#C0392B"/>
      <line x1="682.4" y1="190" x2="682.4" y2="237" stroke="#C0392B" stroke-width="2"/>
      <text x="682.4" y="188" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="end">만료 2021-11-01</text>
      <text x="682.4" y="201" font-size="10" fill="#8289A3" text-anchor="end">2016-11-01 + 5년 = 2021-11-01</text>
    </g>

    <!-- ===== 행 3: 기능상&#183;미관상 (3년, 도과) ===== -->
    <g>
      <rect x="30" y="286" width="44" height="28" rx="6" fill="#E9EDF8"/>
      <text x="52" y="305" font-size="14" font-weight="700" fill="#385783" text-anchor="middle">3년</text>
      <text x="86" y="298" font-size="14" font-weight="700" fill="#223D5B">기능상 &#183; 미관상</text>
      <text x="86" y="314" font-size="10.5" fill="#8289A3">건축설비&#183;목공사&#183;창호&#183;조경 등</text>

      <rect x="300" y="290" width="229.3" height="20" rx="4" fill="#C0392B"/>
      <line x1="529.3" y1="274" x2="529.3" y2="321" stroke="#C0392B" stroke-width="2"/>
      <text x="529.3" y="272" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="end">만료 2019-11-01</text>
      <text x="529.3" y="285" font-size="10" fill="#8289A3" text-anchor="end">2016-11-01 + 3년 = 2019-11-01</text>
    </g>

    <!-- ===== 행 4: 마감공사 (2년, 도과) ===== -->
    <g>
      <rect x="30" y="370" width="44" height="28" rx="6" fill="#E9EDF8"/>
      <text x="52" y="389" font-size="14" font-weight="700" fill="#385783" text-anchor="middle">2년</text>
      <text x="86" y="382" font-size="14" font-weight="700" fill="#223D5B">마감공사 등</text>
      <text x="86" y="398" font-size="10.5" fill="#8289A3">발견&#183;교체&#183;보수 용이한 하자</text>

      <rect x="300" y="374" width="152.9" height="20" rx="4" fill="#C0392B"/>
      <line x1="452.9" y1="358" x2="452.9" y2="405" stroke="#C0392B" stroke-width="2"/>
      <text x="452.9" y="356" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="end">만료 2018-11-01</text>
      <text x="452.9" y="369" font-size="10" fill="#8289A3" text-anchor="end">2016-11-01 + 2년 = 2018-11-01</text>
    </g>

    <!-- 축 -->
    <line x1="300" y1="410" x2="1090" y2="410" stroke="#DDE2EC" stroke-width="1"/>
    <g fill="#8289A3" font-size="10.5" text-anchor="middle">
      <line x1="312.8" y1="410" x2="312.8" y2="415" stroke="#C4CCDD"/>
      <text x="312.8" y="426">2017</text>
      <line x1="465.7" y1="410" x2="465.7" y2="415" stroke="#C4CCDD"/>
      <text x="465.7" y="426">2019</text>
      <line x1="618.8" y1="410" x2="618.8" y2="415" stroke="#C4CCDD"/>
      <text x="618.8" y="426">2021</text>
      <line x1="771.7" y1="410" x2="771.7" y2="415" stroke="#C4CCDD"/>
      <text x="771.7" y="426">2023</text>
      <line x1="924.8" y1="410" x2="924.8" y2="415" stroke="#C4CCDD"/>
      <text x="924.8" y="426">2025</text>
      <line x1="1077.6" y1="410" x2="1077.6" y2="415" stroke="#C4CCDD"/>
      <text x="1077.6" y="426">2027</text>
    </g>
  </g>

  <text x="40" y="580" font-size="12" fill="#8289A3">산출: tools/timeline.py (근거: 집합건물법 제9조의2 &#183; 시행령 제5조) &#183; 입주개시일 미입력으로 공용부분 기산일(사용검사일)로 대체 계산 &#183; 임박 = 만료 12개월 이내</text>
</svg>
