<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 380" font-family="Pretendard, sans-serif"><defs><pattern id="h4" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#D8DCE4" stroke-width="2.4"/></pattern></defs><text x="0" y="22" font-size="16" fill="#0D2162" font-weight="800" text-anchor="start">단열재 변경시공 — 벽 안이라 절개해야 보입니다</text><text x="0" y="50" font-size="15" fill="#0D2162" font-weight="800" text-anchor="start">설계도서 사양</text><rect x="0" y="62" width="120" height="130" fill="url(#h4)" stroke="#C7CBD3" stroke-width="1.4" /><text x="60" y="134" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">외벽</text><rect x="120" y="62" width="72" height="130" fill="#0D2162" stroke="#0D2162" stroke-width="0" /><text x="156.0" y="134" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">가등급</text><rect x="192" y="62" width="90" height="130" fill="#F4F5F8" stroke="#C7CBD3" stroke-width="1.4" /><text x="237" y="134" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">마감</text><g stroke="#0D2162" stroke-width="1.3"><line x1="120" y1="210" x2="192" y2="210"/><line x1="120" y1="205" x2="120" y2="215"/><line x1="192" y1="205" x2="192" y2="215"/></g><text x="156.0" y="226" font-size="14" fill="#0D2162" font-weight="700" text-anchor="middle">THK 85㎜</text><text x="640" y="50" font-size="15" fill="#C0392B" font-weight="800" text-anchor="start">실제 시공</text><rect x="640" y="62" width="120" height="130" fill="url(#h4)" stroke="#C7CBD3" stroke-width="1.4" /><text x="700" y="134" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">외벽</text><rect x="760" y="62" width="48" height="130" fill="#C0392B" stroke="#C0392B" stroke-width="0" /><text x="784.0" y="134" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">나등급</text><rect x="808" y="62" width="90" height="130" fill="#F4F5F8" stroke="#C7CBD3" stroke-width="1.4" /><text x="853" y="134" font-size="12" fill="#5A5F68" font-weight="400" text-anchor="middle">마감</text><g stroke="#C0392B" stroke-width="1.3"><line x1="760" y1="210" x2="808" y2="210"/><line x1="760" y1="205" x2="760" y2="215"/><line x1="808" y1="205" x2="808" y2="215"/></g><text x="784.0" y="226" font-size="14" fill="#C0392B" font-weight="700" text-anchor="middle">THK 60㎜</text><text x="1000" y="92" font-size="14" fill="#C0392B" font-weight="800" text-anchor="start">결로·곰팡이</text><text x="1000" y="114" font-size="13" fill="#5A5F68" font-weight="400" text-anchor="start">사용검사 이후 발생</text><path d="M1004 132 c3 4 5 6 5 8a5 5 0 0 1-10 0c0-2 2-4 5-8z" fill="#C0392B" opacity=".7"/><path d="M1004 152 c3 4 5 6 5 8a5 5 0 0 1-10 0c0-2 2-4 5-8z" fill="#C0392B" opacity=".7"/><path d="M1004 172 c3 4 5 6 5 8a5 5 0 0 1-10 0c0-2 2-4 5-8z" fill="#C0392B" opacity=".7"/><rect x="0" y="250" width="1220" height="92" fill="#FBF7EE" stroke="#E7D9BC" stroke-width="1.4" /><text x="22" y="280" font-size="15" fill="#8F7033" font-weight="800" text-anchor="start">시공은 사용검사 전, 하자 현상은 사용검사 후입니다</text><text x="22" y="306" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">단열재는 사용검사 이전에 바뀌었고 결로는 그 이후에 나타납니다. 원문은 이 경우</text><text x="22" y="328" font-size="13.5" fill="#111418" font-weight="400" text-anchor="start">사용검사 이후 하자로 판단합니다. 보수청구 공문으로 발생 시점을 특정해 두어야 합니다.</text></svg>