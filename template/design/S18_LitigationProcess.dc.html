<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D2162;--navy-deep:#081541;--gold:#B08D4F;--gold-ink:#8F7033;
    --ink:#111418;--muted:#111418;--card:#F4F5F8;--line:#C7CBD3;--bg:#fff;--alert:#C0392B;--warn:#E67E22;}
  html,body{width:1332px;height:750px;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);position:relative;}
  .runner{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:15px;color:var(--muted);}
  .eyebrow{position:absolute;left:56px;top:70px;font-size:15px;letter-spacing:.2em;color:var(--gold-ink);
    font-weight:700;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--gold-ink);}
  .badge{position:absolute;right:56px;top:70px;font-size:14px;color:#8F7033;background:#FBF7EE;
    border:1px solid #E7D9BC;border-radius:0;padding:4px 10px;}
  .title{position:absolute;left:56px;top:96px;right:56px;font-size:26px;font-weight:800;
    color:var(--navy);letter-spacing:-.02em;line-height:1.4;}
  .note{font-size:14px;color:var(--muted);background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);
    border-radius:0;padding:12px 18px;line-height:1.6;}
  .note-gold{font-size:14px;color:var(--muted);background:#FBF7EE;border:1px solid #E7D9BC;
    border-radius:0;padding:12px 18px;line-height:1.7;}
  .footer{position:absolute;bottom:0;left:0;right:0;height:36px;display:flex;align-items:center;
    justify-content:space-between;padding:0 56px;border-top:1.4px solid var(--line);
    font-size:14px;color:var(--muted);}
  .footer .firm{color:var(--navy);font-weight:700;}

  .chart{position:absolute;left:56px;top:170px;right:56px;height:400px;border:1px solid var(--line);
    border-radius:0;overflow:hidden;}
  .chart img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .total{position:absolute;left:56px;bottom:56px;right:56px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);
    border-radius:0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-size:15px;}
  .total b{color:var(--navy);font-size:17.5px;}

  /* ── 법무법인 제안서 헤더 밴드 ── */
  body::before{content:"";position:absolute;left:0;top:0;right:0;height:142px;
    background:linear-gradient(150deg,#0D2162 0%,#081541 100%);z-index:0;}
  body::after{content:"";position:absolute;left:0;top:142px;right:0;height:4px;
    background:var(--gold);z-index:1;}
  .runner{z-index:2;color:rgba(255,255,255,.66)!important;}
  .eyebrow{z-index:2;color:#CBB27E!important;}
  .eyebrow::before{background:#CBB27E!important;}
  .title{z-index:2;color:#FFFFFF!important;}
  .badge{z-index:2;background:rgba(255,255,255,.10)!important;
    border-color:rgba(203,178,126,.55)!important;color:#CBB27E!important;}

  /* ── 바탕 ── 흰 여백이 구멍처럼 보이지 않도록 연한 지면을 깔고
     내용 블록을 흰색으로 올린다. 빈 곳도 지면으로 읽힌다. */
  html,body{background:#E9EEF7!important;}
  body>*:not(.runner):not(.eyebrow):not(.title):not(.badge):not(.footer){z-index:1;}
  .footer{background:#fff;border-top:2px solid var(--navy)!important;z-index:2;}
  /* 흰 블록 위로 올라오는 요소들 */
  .note,.card,.c,.g,.b,.n,.m,.st,.item,.qa,.q,.p,.w,.s,.z,.tbl,.table,
  .cards>div,.grid>div,.list>div,.cols>div,.need>div,.stages>div{background:#fff;}
  .note{background:#fff!important;}

  /* 네이비 패널 내부는 바탕 규칙에서 제외 (흰 칠이 글자를 덮지 않도록) */
  .warn *,.decide *,.result *,.rec *,.calc *,.contact *,.key *,.resp *,
  .sum *,.panel *,.band *,.record *,.total *{background:transparent!important;}
</style>
</head>
<body>
  <div class="runner"><span>법무법인 제이엘 하자소송 수행 제안서</span><span>18 / 31</span></div>
  <div class="eyebrow">소송 절차 11단계 [고정]</div>
  <div class="title">감정 절차가 소송 전체 소요기간을 좌우합니다</div>
  <div class="chart"><img src="s18_litigation_steps.png"></div>
  <div class="total"><span>1심 평균 소요기간</span><b>약 2년 6개월 종결</b></div>
  <div class="footer"><span class="firm">법무법인 제이엘</span><span>JL LAWFIRM</span></div>
</body>
</html>
