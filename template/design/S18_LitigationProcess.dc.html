<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D2162;--navy-deep:#081541;--gold:#B08D4F;--gold-ink:#8F7033;
    --ink:#111418;--muted:#111418;--card:#F4F5F8;--line:#C7CBD3;--bg:#fff;--alert:#C0392B;--warn:#E67E22;}
  html,body{width:1332px;height:750px;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);position:relative;}
  .runner{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:15px;color:var(--muted);}
  .eyebrow{position:absolute;left:56px;top:70px;font-size:15px;letter-spacing:.2em;color:var(--gold-ink);
    font-weight:700;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--gold-ink);}
  .badge{position:absolute;right:56px;top:70px;font-size:14px;color:#8F7033;background:#FBF7EE;
    border:1px solid #E7D9BC;border-radius:3px;padding:4px 10px;}
  .title{position:absolute;left:56px;top:96px;right:56px;font-size:26px;font-weight:800;
    color:var(--navy);letter-spacing:-.02em;line-height:1.4;}
  .note{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:12px 18px;line-height:1.6;}
  .note-gold{font-size:14px;color:var(--muted);background:#FBF7EE;border:1px solid #E7D9BC;
    border-radius:4px;padding:12px 18px;line-height:1.7;}
  .footer{position:absolute;bottom:0;left:0;right:0;height:36px;display:flex;align-items:center;
    justify-content:space-between;padding:0 56px;border-top:1.4px solid var(--line);
    font-size:14px;color:var(--muted);}
  .footer .firm{color:var(--navy);font-weight:700;}

  .chart{position:absolute;left:56px;top:170px;right:56px;height:400px;border:1px solid var(--line);
    border-radius:6px;overflow:hidden;}
  .chart img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .total{position:absolute;left:56px;bottom:56px;right:56px;background:var(--card);border:1px solid var(--line);
    border-radius:6px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-size:15px;}
  .total b{color:var(--navy);font-size:17.5px;}
</style>
</head>
<body>
  <div class="runner"><span>법무법인 제이엘 하자소송 수행 제안서</span><span>18 / 31</span></div>
  <div class="eyebrow">소송 절차 11단계 [고정]</div>
  <div class="title">감정 절차가 소송 전체 소요기간을 좌우합니다</div>
  <div class="chart"><img src="s18_litigation_steps.png"></div>
  <div class="total"><span>1심 평균 소요기간</span><b>약 2년 6개월 종결</b></div>
  <div class="footer"><span class="firm">법무법인 제이엘</span><span>JL LAWFIRM</span></div>
</body>
</html>
