<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  @font-face{
    font-family:"Pretendard";
    src:local("Pretendard");
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1332px;height:750px;overflow:hidden;background:#fff;
    font-family:"Pretendard","Malgun Gothic",sans-serif;position:relative;}

  .runner{position:absolute;top:36px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:12px;color:#5A5F68;letter-spacing:.04em;}

  .photo{position:absolute;top:0;right:0;width:420px;height:750px;overflow:hidden;background:#0D2162;}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:180px;
    background:linear-gradient(to top, rgba(8,21,65,.88), rgba(8,21,65,0));}
  .photo .cap{position:absolute;left:20px;bottom:20px;right:20px;z-index:2;
    font-size:11px;color:rgba(255,255,255,.92);line-height:1.6;letter-spacing:.01em;}

  .eyebrow{position:absolute;left:56px;top:150px;display:flex;align-items:center;gap:12px;
    font-size:13px;letter-spacing:.22em;color:#8F7033;font-weight:600;}
  .eyebrow .bar{width:40px;height:1px;background:#8F7033;display:inline-block;}

  .title{position:absolute;left:56px;top:188px;width:800px;
    font-size:44px;font-weight:800;line-height:1.38;letter-spacing:-.02em;color:#0D2162;}
  .title em{font-style:normal;color:#B08D4F;}

  .sub{position:absolute;left:56px;top:398px;width:800px;
    font-size:15px;line-height:1.9;color:#42506A;}

  .stats{position:absolute;left:56px;top:498px;width:800px;display:flex;
    border-top:1.4px solid #C7CBD3;padding-top:22px;}
  .stat{flex:1;}
  .stat .n{font-size:28px;font-weight:800;color:#0D2162;letter-spacing:-.01em;}
  .stat .l{margin-top:7px;font-size:11.5px;color:#5A5F68;letter-spacing:.01em;}

  .recipient{position:absolute;left:56px;top:610px;font-size:14px;color:#42506A;}
  .recipient b{color:#111418;font-weight:700;margin-left:6px;}

  .foot{position:absolute;left:56px;top:662px;width:800px;
    border-top:1.4px solid #C7CBD3;padding-top:18px;display:flex;align-items:center;justify-content:space-between;}
  .foot img{display:block;height:26px;width:auto;}
  .foot .name{font-size:12px;color:#5A5F68;letter-spacing:.03em;}
</style>
</head>
<body>
  <div class="runner"><span>법무법인 제이엘 하자소송 수행 제안서</span><span>01 / 31</span></div>

  <div class="photo">
    <img src="cover-photo.jpg">
    <div class="cap">현장 실측 · 파취조사를 통한 방수층 두께 계측</div>
  </div>

  <div class="eyebrow"><span class="bar"></span>DEFECT LITIGATION PROPOSAL</div>

  <div class="title">담보책임기간이<br>도과하기 전,<br><em>지금</em> 검토가 필요합니다</div>

  <div class="sub">공동주택 하자소송을 하자 진단부터 감정, 소송, 회수까지<br>법무법인 제이엘이 처음부터 끝까지 직접 수행합니다.</div>

  <div class="stats">
    <div class="stat"><div class="n">18건</div><div class="l">수행 사건</div></div>
    <div class="stat"><div class="n">328억</div><div class="l">판결금 합계</div></div>
    <div class="stat"><div class="n">329만원</div><div class="l">세대당 평균</div></div>
  </div>

  <div class="recipient">수신 <b>{{단지명}} 입주자대표회의 귀중</b></div>

  <div class="foot">
    <img src="jl-logo.png">
    <span class="name">법무법인 제이엘 · JL LAWFIRM</span>
  </div>
</body>
</html>
